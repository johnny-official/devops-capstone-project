---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean a workspace by deleting its contents.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        rm -rf "$(workspaces.source.path)"/*
        rm -rf "$(workspaces.source.path)"/.[!.]*
        rm -rf "$(workspaces.source.path)"/..?* || true
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run nosetests on the provided source workspace.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nosetests.
      type: string
      default: "-v"
    - name: database_uri
      description: Database connection string.
      type: string
      default: "sqlite:///test.db"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir --upgrade pip wheel
        pip install --no-cache-dir -r requirements.txt
        nosetests $(params.args)
